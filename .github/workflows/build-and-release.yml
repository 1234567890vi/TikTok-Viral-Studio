name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK Licenses & Verify NDK
        run: |
          echo "Accepting Android SDK licenses and ensuring Android 36 platform..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
          echo "Available NDKs:"
          ls -la $ANDROID_HOME/ndk/ || true
          echo "Available CMake:"
          ls -la $ANDROID_HOME/cmake/ || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease :admin-app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APKs
        run: |
          mkdir -p release-output
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v2.3.2"
          fi
          echo "Processing release for tag: $TAG_NAME"

          # Locate Client APK
          CLIENT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$CLIENT_APK" ]; then
            CLIENT_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found Client APK at: $CLIENT_APK"

          # Locate Admin APK
          ADMIN_APK=$(find admin-app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$ADMIN_APK" ]; then
            ADMIN_APK=$(find admin-app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found Admin APK at: $ADMIN_APK"

          if [ -z "$CLIENT_APK" ] || [ -z "$ADMIN_APK" ]; then
            echo "Error: One or both APKs were not generated!"
            exit 1
          fi

          # Copy Client APK
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio-${TAG_NAME}.apk"
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio-v2.3.2.apk"
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio.apk"

          # Copy Admin APK
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin-${TAG_NAME}.apk"
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin-v2.3.2.apk"
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin.apk"

          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Viral-Studio-APKs
          path: release-output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.3.2' }}
          name: "Creator & TikTok Viral Studio ${{ github.ref_type == 'tag' && github.ref_name || 'v2.3.2' }}"
          body: |
            ## ⚡ Creator & TikTok Viral Studio (${{ github.ref_type == 'tag' && github.ref_name || 'v2.3.2' }})
            
            تحديث فائق الدقة: إزالة كاملة للهدايا والداعمين العشوائيين وربط حقيقي للايكات 6.3M والشات الحي 100% Real Data:
            - **إزالة مولد الهدايا العشوائي (Zero Random Mock Generator)**: إزالة تامة لأي حلقة تولد رسائل وهمية ("داعم #23"، "Rose x13"، "Lion x4"، "COMBO x4") - لا تظهر الهدايا والكومبو إلا بوصول أحداث سيرفر حقيقية WebcastGiftMessage.
            - **ربط دقيق للايكات الحقيقية (Real 6.3M Likes)**: ربط مباشر مع `liveRoomStats.likeCount` و `webcast/room/info` دون استبدالها برقم المتابعين أو قيم عشوائية.
            - **ربط قائمة كبار الداعمين بالكوينز الحقيقية**: سحب قائمة المتصدرين مباشرة من Webcast Online Audience Ranklist مع الحسابات والأفاتار الحقيقي ومجموع النقاط.
            - **عرض فيديو طولي مركزي (9:16)**: معالجة الهوامش السوداء العلوية بالكامل وملء إطار العرض في المنتصف بأداء 60FPS.
            - **تحديث سحابي لتطبيق الإدارة (:admin-app)** وتطبيق المستخدمين (:app) مع التوقيع بالمفتاح الثابت المعتمد.
            
            ### 📦 روابط التحميل المباشرة:
            1. **تطبيق المستخدمين الأساسي**:
               - `TikTok-Viral-Studio-v2.3.2.apk`
               - `TikTok-Viral-Studio.apk`
            2. **تطبيق لوحة تحكم الأدمن المستقل**:
               - `TikTok-Studio-Admin-v2.3.2.apk` (رمز الدخول: `Admin2026`)
               - `TikTok-Studio-Admin.apk`
          files: release-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
