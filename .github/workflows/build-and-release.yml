name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK Licenses & Verify NDK
        run: |
          echo "Accepting Android SDK licenses and ensuring Android 36 platform..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
          echo "Available NDKs:"
          ls -la $ANDROID_HOME/ndk/ || true
          echo "Available CMake:"
          ls -la $ANDROID_HOME/cmake/ || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease :admin-app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APKs
        run: |
          mkdir -p release-output
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v2.2.0"
          fi
          echo "Processing release for tag: $TAG_NAME"

          # Locate Client APK
          CLIENT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$CLIENT_APK" ]; then
            CLIENT_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found Client APK at: $CLIENT_APK"

          # Locate Admin APK
          ADMIN_APK=$(find admin-app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$ADMIN_APK" ]; then
            ADMIN_APK=$(find admin-app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found Admin APK at: $ADMIN_APK"

          if [ -z "$CLIENT_APK" ] || [ -z "$ADMIN_APK" ]; then
            echo "Error: One or both APKs were not generated!"
            exit 1
          fi

          # Copy Client APK
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio-${TAG_NAME}.apk"
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio-v2.2.0.apk"
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio.apk"

          # Copy Admin APK
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin-${TAG_NAME}.apk"
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin-v2.2.0.apk"
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin.apk"

          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Viral-Studio-APKs
          path: release-output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.0' }}
          name: "Creator & TikTok Viral Studio ${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.0' }}"
          body: |
            ## ⚡ Creator & TikTok Viral Studio (${{ github.ref_type == 'tag' && github.ref_name || 'v2.2.0' }})
            
            ترقية معمارية شاملة: البث اللحظي المدفوع بالأحداث (Zero-Latency WebSocket & Protobuf Event-Driven Architecture):
            - **إلغاء التحديث الدوري (No Polling)**: استبدال الـ HTTP Polling بقناة WebSocket مباشرة وتدفق أحداث فوري (0ms Latency) يغذي الواجهة بلغة Kotlin SharedFlow.
            - **معالجة فائقة السرعة عبر C++ NDK**: مسار معالجة منخفض المستوى (Native Ring Buffer & Gzip Parser) لفك تشفير الإطارات الثنائية القادمة من البث في النانو ثانية وتمريرها عبر JNI بدون أي عبء على الذاكرة أو Garbage Collection.
            - **تحديث أحداث الجولة اللحظية**: رصد فوري للتعليقات، الهدايا، ضربات الكومبو المتتالية (Combos)، عداد اللايكات، نقاط الجولة، القفازات المشتعلة، الغيمة السحرية، ومزامنة ساعة وقت الحكم بدقة 100%.
            - **مشغل Media3 ExoPlayer فائق الكمون المنخفض (Ultra-Low Latency Media3 Pipeline)**: تهيئة Buffering (500ms - 2000ms) وتزامن مباشر عبر OkHttpDataSource.Factory بمعدل 60FPS ثابت.
            - **دعم تقسيم الشاشة التفاعلي (Split-Screen PK)**: عرض بث المضيف والخصم معاً جنبًا إلى جنب بأعلى سلاسة.
            - **تحديث سحابي لتطبيق الإدارة (:admin-app)**: فاحص التحديثات السحابي OTA المدمج داخل لوحة الإدارة وتثبيت التحديثات بنقرة زر واحدة.
            - **توافق تام للحزم**: توقيع الحزم بنفس المفتاح الثابت `app/release.keystore`.
            
            ### 📦 روابط التحميل المباشرة:
            1. **تطبيق المستخدمين الأساسي**:
               - `TikTok-Viral-Studio-v2.2.0.apk`
               - `TikTok-Viral-Studio.apk`
            2. **تطبيق لوحة تحكم الأدمن المستقل**:
               - `TikTok-Studio-Admin-v2.2.0.apk` (رمز الدخول: `Admin2026`)
               - `TikTok-Studio-Admin.apk`
          files: release-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
