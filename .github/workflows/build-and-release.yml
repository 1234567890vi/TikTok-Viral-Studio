name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Accept Android SDK Licenses & Verify NDK
        run: |
          echo "Accepting Android SDK licenses and ensuring Android 36 platform..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true
          echo "Available NDKs:"
          ls -la $ANDROID_HOME/ndk/ || true
          echo "Available CMake:"
          ls -la $ANDROID_HOME/cmake/ || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APKs
        run: ./gradlew :app:assembleRelease :admin-app:assembleRelease --no-daemon --stacktrace

      - name: Prepare Release APKs
        run: |
          mkdir -p release-output
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v2.1.0"
          fi
          echo "Processing release for tag: $TAG_NAME"

          # Locate Client APK
          CLIENT_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$CLIENT_APK" ]; then
            CLIENT_APK=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found Client APK at: $CLIENT_APK"

          # Locate Admin APK
          ADMIN_APK=$(find admin-app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$ADMIN_APK" ]; then
            ADMIN_APK=$(find admin-app/build/outputs/apk -name "*.apk" | head -n 1)
          fi
          echo "Found Admin APK at: $ADMIN_APK"

          if [ -z "$CLIENT_APK" ] || [ -z "$ADMIN_APK" ]; then
            echo "Error: One or both APKs were not generated!"
            exit 1
          fi

          # Copy Client APK
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio-${TAG_NAME}.apk"
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio-v2.1.1.apk"
          cp "$CLIENT_APK" "release-output/TikTok-Viral-Studio.apk"

          # Copy Admin APK
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin-${TAG_NAME}.apk"
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin-v2.1.1.apk"
          cp "$ADMIN_APK" "release-output/TikTok-Studio-Admin.apk"

          ls -la release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-Viral-Studio-APKs
          path: release-output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v2.1.1' }}
          name: "Creator & TikTok Viral Studio ${{ github.ref_type == 'tag' && github.ref_name || 'v2.1.1' }}"
          body: |
            ## ⚡ Creator & TikTok Viral Studio (${{ github.ref_type == 'tag' && github.ref_name || 'v2.1.1' }})
            
            تحديث شامل وإصلاح جذري للبحث باليوزر مباشرة في الفحص الشامل وتتبع اللايف:
            - **دعم البحث والفحص المباشر باسم المستخدم (@username أو username)**: بدون اشتراط كتابة رابط كامل http أو tiktok، مع استخراج فوري لبيانات الحساب وبطاقة البروفايل بأعلى دقة.
            - **رصد حالة البث المباشر (Online / Offline)**: عند إدخال اسم مستخدم غير متصل ببث مباشر، تظهر بطاقة الحساب الأنيقة مع تنبيه واضح وزر لبدء جولة تجريبية تفاعلية.
            - **استجابة فورية لصندوق المراحل (ProcessingStepsBox)**: يبدأ فوراً بمؤقت 3.0s وبموجات رقمية بألوان السيان والوردي عند الضغط على أي زر فحص أو تتبع.
            - **تتبع البث المباشر وجولات PK الحقيقية (60FPS Zero-Lag Live Tracker)**: تشغيل الفيديو بتسريع العتاد عبر Media3 ExoPlayer وعزل طبقات العرض لمنع أي تقطيع أثناء التحديات.
            - **تتبع القفازات المشتعلة (Boosting Gloves x2/x3/x5)**: رصد توهج القفاز والمؤقت التنازلي لمضاعفة النقاط لحظياً.
            - **تأثير الغيمة السحرية (Magic Mist)**: ضباب متحرك يحجب النقاط ويحولها إلى (???) في الوقت الحقيقي طوال فترة الغيمة.
            - **ترجمة تفاعلية شاملة 100% (AR, EN, FR)**: تغطية كافة الشاشات والقوائم مع دعم التبديل التلقائي لاتجاه الواجهة RTL/LTR ودعم الوضعين الليلي والنهاري.
            - **تحديث سحابي لتطبيق الإدارة (:admin-app)**: فاحص التحديثات السحابي OTA المدمج داخل لوحة الإدارة وتثبيت التحديثات بنقرة زر واحدة.
            - **توافق تام للحزم**: توقيع الحزم بنفس المفتاح الثابت `app/release.keystore`.
            
            ### 📦 روابط التحميل المباشرة:
            1. **تطبيق المستخدمين الأساسي**:
               - `TikTok-Viral-Studio-v2.1.1.apk`
               - `TikTok-Viral-Studio.apk`
            2. **تطبيق لوحة تحكم الأدمن المستقل**:
               - `TikTok-Studio-Admin-v2.1.1.apk` (رمز الدخول: `Admin2026`)
               - `TikTok-Studio-Admin.apk`
          files: release-output/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
